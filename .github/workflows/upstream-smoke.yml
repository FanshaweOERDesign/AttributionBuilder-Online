name: Upstream Schema Smoke Tests

on:
  schedule:
    # Runs every day at 08:00 UTC (3:00 AM EST / 4:00 AM EDT)
    - cron: '22 16 * * *'

  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Cypress upstream smoke tests
        uses: cypress-io/github-action@v6
        with:
          command: npm run test:smoke

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-screenshots
          path: cypress/screenshots

      - name: Open GitHub Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Upstream Schema Smoke Test Failed',
              body: `One or more live upstream sources (Pressbooks, OpenStax, LibreTexts, or YouTube) failed the scheduled smoke test.\n\nView logs and failure screenshots here: ${runUrl}`,
              labels: ['bug']
            });
